<!doctype html><html><head><base target="_top"><?!= include('styles'); ?></head><body><div class="wrap"><div class="hero"><h1>STAFF CHECK-IN</h1><p>มีสุข รับจัดงานบุญ ครบวงจร</p></div><div class="card"><h2>ตรวจสอบผู้เข้าร่วมงาน</h2><p class="muted">สแกน QR ด้วยกล้อง/แอปสแกน แล้ววางค่าที่ได้ หรือพิมพ์รหัส MS-xxxxxx</p><div class="field"><input id="code" placeholder="QR token หรือ MS-000001"></div><button onclick="go()">เช็กอิน</button><div id="result"></div></div></div><script>
function go(){const code=document.getElementById('code').value;google.script.run.withSuccessHandler(r=>{let h='';if(r.ok)h='<div class="status ok"><h2>✓ CHECK-IN สำเร็จ</h2><b>'+r.name+'</b><p>'+r.id+' · ผู้ติดตาม '+r.guests+' · โต๊ะ '+(r.table||'-')+'</p></div>';else if(r.duplicate)h='<div class="status bad"><h2>QR นี้เช็กอินแล้ว</h2><p>'+r.name+' · '+r.id+'</p></div>';else h='<div class="status bad">ไม่พบข้อมูลลงทะเบียน</div>';document.getElementById('result').innerHTML=h;document.getElementById('code').value=''}).checkIn(code)}
</script></body></html>
