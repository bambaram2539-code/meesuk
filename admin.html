<!doctype html><html><head><base target="_top"><?!= include('styles'); ?></head><body><div class="wrap" style="max-width:1100px"><div class="hero"><h1>Dashboard ผู้จัดงาน</h1><p>MESOOK Event Registration</p></div><div class="grid" id="metrics"></div><div class="card"><button class="btn2" onclick="load()">รีเฟรชข้อมูล</button><div class="scroll"><table><thead><tr><th>รหัส</th><th>ชื่อ</th><th>โทร</th><th>ผู้ติดตาม</th><th>โต๊ะ</th><th>สถานะ</th><th>เวลา</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script>
function load(){google.script.run.withSuccessHandler(d=>{document.getElementById('metrics').innerHTML=`<div class="metric">ลงทะเบียน<b>${d.total}</b></div><div class="metric">เช็กอินแล้ว<b>${d.checked}</b></div><div class="metric">ยังไม่เข้า<b>${d.pending}</b></div><div class="metric">ผู้ติดตาม<b>${d.followers}</b></div>`;document.getElementById('rows').innerHTML=d.rows.map(x=>`<tr><td>${x.id}</td><td>${x.name}</td><td>${x.phone}</td><td>${x.guests}</td><td>${x.table||'-'}</td><td>${x.status}</td><td>${x.checkInAt||'-'}</td></tr>`).join('')}).getDashboard()}load();setInterval(load,30000)
</script></body></html>
